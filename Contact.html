<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ISET Library - Contact</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <img src="images/logo.png" alt="Logo ISET">

            <h1>ISET Library</h1>

        </div>


        <nav>

            <a href="index.html">Accueil</a>

            <a href="livres.html">Livres</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>


    <!-- CONTENU -->

    <main>

        <section class="contact-section">

            <h2>Contactez-nous</h2>

            <p>
                Pour toute question concernant
                nos livres, contactez-nous.
            </p>


            <!-- FORMULAIRE -->

            <form id="contactForm">

                <!-- NOM -->

                <div class="form-group">

                    <label for="nom">
                        Nom :
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Entrez votre nom">

                </div>


                <!-- PRENOM -->

                <div class="form-group">

                    <label for="prenom">
                        Prénom :
                    </label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        placeholder="Entrez votre prénom">

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email :
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com">

                </div>


                <!-- TELEPHONE -->

                <div class="form-group">

                    <label for="telephone">
                        Téléphone :
                    </label>

                    <input
                        type="tel"
                        id="telephone"
                        name="telephone"
                        placeholder="XX XXX XXX">

                </div>


                <!-- SUJET -->

                <div class="form-group">

                    <label for="sujet">
                        Sujet :
                    </label>

                    <select id="sujet" name="sujet">

                        <option value="">
                            -- Choisir un sujet --
                        </option>

                        <option value="information">
                            Information
                        </option>

                        <option value="emprunt">
                            Emprunt
                        </option>

                        <option value="retour">
                            Retour d'un livre
                        </option>

                        <option value="technique">
                            Problème technique
                        </option>

                        <option value="autre">
                            Autre
                        </option>

                    </select>

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message :
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Écrivez votre message..."></textarea>

                    <p id="counter">
                        Nombre de caractères : 0
                    </p>

                </div>


                <!-- BOUTONS -->

                <div class="buttons">

                    <button type="submit">
                        Envoyer
                    </button>

                    <button type="reset">
                        Réinitialiser
                    </button>

                </div>


                <!-- MESSAGE JAVASCRIPT -->

                <p id="result"></p>

            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; <span id="year">2026</span>
            ISET Library - Tous droits réservés
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
